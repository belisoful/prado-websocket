name: PRADO WebSocket Extension
on:
  # A push to the default branch or of a tag.  A branch under review runs through its pull request,
  # so a pull request from this repository runs once.  Any other branch runs on request
  # (workflow_dispatch).
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  # Weekly, Monday 04:23 UTC: the build tracks PRADO master and prado-http2 main, so an upstream
  # break shows without a push here.
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  # A newer run for the same event and ref supersedes the run still in progress.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # The PHP version of the integration and browser (Playwright) jobs
  PHP_VERSION: '8.4'
  # sockets is used by one unit test (a TCP reset through SO_LINGER); nothing in src/ needs it.
  PHP_EXTENSIONS: ctype, dom, ffi, intl, json, mbstring, openssl, pcre, sockets, spl, zlib
jobs:
  composerext:
    name: WebSocket (PHP ${{ matrix.php-versions }}, prado-http2 ${{ matrix.http2 }})
    # Ubuntu 24.04 ships libnghttp2 1.59.0, older than the 1.60.0 prado-http2 needs; 26.04 ships 1.68.0.
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        # 'main' builds against the prado-http2 development HEAD; 'release' installs the Packagist
        # release that the `^1.5` constraint resolves to, which is what users install.
        http2: ['main']
        include:
          - php-versions: '8.4'
            http2: 'release'

    defaults:
      run:
        # bash runs with `-eo pipefail`, so a failing checker fails its `… | cs2pr` step.
        shell: bash
        working-directory: prado-websocket

    steps:
      - name: Checkout extension
        uses: actions/checkout@v7
        with:
          path: prado-websocket

      - name: Checkout PRADO framework (4.4 dev)
        uses: actions/checkout@v7
        with:
          repository: pradosoft/prado
          ref: master
          path: prado

      - name: Checkout Belisoful HTTP/2 extension
        if: matrix.http2 == 'main'
        uses: actions/checkout@v7
        with:
          repository: belisoful/prado-http2
          ref: main
          path: prado-http2

      - name: Configure apt retries and timeouts
        run: sudo bash .github/scripts/configure-apt.sh

      - name: Install libnghttp2
        timeout-minutes: 12
        run: |
          sudo bash .github/scripts/retry.sh 3 90 apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive bash .github/scripts/retry.sh 3 120 apt-get install -y libnghttp2-dev

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        timeout-minutes: 10
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: cs2pr

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-http2-${{ matrix.http2 }}-composer-${{ hashFiles('prado-websocket/composer.json', 'prado/composer.json', 'prado-http2/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-versions }}-http2-${{ matrix.http2 }}-composer-

      - name: Register the sibling PRADO 4.4 checkout as a Composer path repository
        run: composer config repositories.prado '{"type":"path","url":"../prado","options":{"symlink":true,"versions":{"pradosoft/prado":"4.4.0"}}}'

      - name: Register the sibling HTTP/2 checkout as a Composer path repository
        if: matrix.http2 == 'main'
        run: composer config repositories.prado-http2 '{"type":"path","url":"../prado-http2","options":{"symlink":true,"versions":{"belisoful/prado-http2":"1.5.0"}}}'

      - name: Install Composer dependencies
        timeout-minutes: 10
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # A path repository installs a symlink to the sibling checkout; a Packagist release installs a directory.
      - name: Report the installed prado-http2 and check where the dependencies came from
        env:
          HTTP2: ${{ matrix.http2 }}
        run: |
          composer show belisoful/prado-http2
          if [ ! -L vendor/pradosoft/prado ]; then
            echo "::error::vendor/pradosoft/prado is not the sibling PRADO checkout."
            exit 1
          fi
          if [ "$HTTP2" = release ] && [ -L vendor/belisoful/prado-http2 ]; then
            echo "::error::The release leg installed the prado-http2 path repository, not the Packagist release."
            exit 1
          fi
          if [ "$HTTP2" = main ] && [ ! -L vendor/belisoful/prado-http2 ]; then
            echo "::error::vendor/belisoful/prado-http2 is not the sibling prado-http2 checkout."
            exit 1
          fi

      # Without the library every HTTP/2 test skips; this step names the cause.
      - name: Require libnghttp2 through FFI
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          if (!Prado\IO\Http2\TNgHttp2::isAvailable()) {
              echo '::error::libnghttp2 is not available through FFI (Prado\IO\Http2\TNgHttp2::isAvailable() is false).', PHP_EOL;
              exit(1);
          }
          echo 'libnghttp2 ', Prado\IO\Http2\TNgHttp2::version(), PHP_EOL;
          PHP

      # The pinned php-cs-fixer and phpstan from composer.json, so CI and `composer fix`/`composer stan` agree.
      - name: Validate code syntax using php-cs-fixer (src)
        run: vendor/bin/php-cs-fixer check src -vvv --using-cache=no --format=checkstyle | cs2pr

      - name: Validate code syntax using php-cs-fixer (tests)
        run: vendor/bin/php-cs-fixer check tests -vvv --using-cache=no --format=checkstyle | cs2pr

      - name: Validate code syntax using php-cs-fixer (examples)
        run: vendor/bin/php-cs-fixer check examples -vvv --using-cache=no --format=checkstyle | cs2pr

      - name: Validate code using phpstan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=checkstyle | cs2pr

      # CI has every optional dependency, so a skipped, incomplete or risky test fails the job.
      - name: Run Unit Tests
        run: composer unittest -- --fail-on-skipped --fail-on-incomplete --fail-on-risky --display-skipped --display-incomplete

  integration:
    name: WebSocket integration (Redis)
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # Read by the integration tests; the service's port is published on the runner.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    defaults:
      run:
        shell: bash
        working-directory: prado-websocket

    steps:
      - name: Checkout extension
        uses: actions/checkout@v7
        with:
          path: prado-websocket

      - name: Checkout PRADO framework (4.4 dev)
        uses: actions/checkout@v7
        with:
          repository: pradosoft/prado
          ref: master
          path: prado

      - name: Checkout Belisoful HTTP/2 extension
        uses: actions/checkout@v7
        with:
          repository: belisoful/prado-http2
          ref: main
          path: prado-http2

      - name: Configure apt retries and timeouts
        run: sudo bash .github/scripts/configure-apt.sh

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        timeout-minutes: 10
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}, redis

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ env.PHP_VERSION }}-http2-main-composer-${{ hashFiles('prado-websocket/composer.json', 'prado/composer.json', 'prado-http2/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ env.PHP_VERSION }}-http2-main-composer-

      - name: Register the sibling PRADO 4.4 and HTTP/2 checkouts as Composer path repositories
        run: |
          composer config repositories.prado '{"type":"path","url":"../prado","options":{"symlink":true,"versions":{"pradosoft/prado":"4.4.0"}}}'
          composer config repositories.prado-http2 '{"type":"path","url":"../prado-http2","options":{"symlink":true,"versions":{"belisoful/prado-http2":"1.5.0"}}}'

      - name: Install Composer dependencies
        timeout-minutes: 10
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # Without the extension or the server every integration test skips; this step names the cause.
      - name: Require the redis extension and the Redis service
        run: |
          php <<'PHP'
          <?php
          if (!extension_loaded('redis')) {
              echo '::error::The redis extension is not loaded.', PHP_EOL;
              exit(1);
          }
          $redis = new Redis();
          try {
              $redis->connect(getenv('REDIS_HOST'), (int) getenv('REDIS_PORT'), 5.0);
              echo 'Redis server ', $redis->info('server')['redis_version'], ', ext-redis ', phpversion('redis'), PHP_EOL;
          } catch (RedisException $e) {
              echo '::error::No Redis server answers at ', getenv('REDIS_HOST'), ':', getenv('REDIS_PORT'), ': ', $e->getMessage(), PHP_EOL;
              exit(1);
          }
          PHP

      # A skipped, incomplete or risky test fails the job, and so does a suite without tests.
      - name: Run Integration Tests
        run: composer integrationtest -- --fail-on-skipped --fail-on-incomplete --fail-on-risky --fail-on-empty-test-suite --display-skipped --display-incomplete

  playwright:
    name: WebSocket Playwright (${{ matrix.browser_name }})
    # Ubuntu 24.04 ships libnghttp2 1.59.0, older than the 1.60.0 prado-http2 needs; 26.04 ships 1.68.0.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            browser_name: Chromium
          - browser: firefox
            browser_name: Firefox
          - browser: webkit
            browser_name: WebKit

    env:
      BROWSER: ${{ matrix.browser }}

    defaults:
      run:
        shell: bash
        working-directory: prado-websocket

    steps:
      - name: Checkout extension
        uses: actions/checkout@v7
        with:
          path: prado-websocket

      - name: Checkout PRADO framework (4.4 dev)
        uses: actions/checkout@v7
        with:
          repository: pradosoft/prado
          ref: master
          path: prado

      - name: Checkout Belisoful HTTP/2 extension
        uses: actions/checkout@v7
        with:
          repository: belisoful/prado-http2
          ref: main
          path: prado-http2

      # Before the first apt step: the libnghttp2 install, the PHP setup and the browser's system packages.
      - name: Configure apt retries and timeouts
        run: sudo bash .github/scripts/configure-apt.sh

      - name: Install libnghttp2
        timeout-minutes: 12
        run: |
          sudo bash .github/scripts/retry.sh 3 90 apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive bash .github/scripts/retry.sh 3 120 apt-get install -y libnghttp2-dev

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        timeout-minutes: 10
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ env.PHP_VERSION }}-http2-main-composer-${{ hashFiles('prado-websocket/composer.json', 'prado/composer.json', 'prado-http2/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ env.PHP_VERSION }}-http2-main-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: prado-websocket/.nvmrc

      # `npm ci` installs what package-lock.json records; without a lockfile, package.json's exact pin.
      - name: Install npm dependencies
        timeout-minutes: 10
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # The browser build depends on the distribution, the architecture and the Playwright version,
      # which package.json pins exactly.
      - name: Describe the runner image
        id: image
        run: echo "id=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser (${{ matrix.browser_name }})
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.id }}-${{ matrix.browser }}-${{ hashFiles('prado-websocket/package.json') }}

      - name: Download the Playwright browser (${{ matrix.browser_name }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 210 npx playwright install "$BROWSER"

      # Every run: system packages are not cached.  This is `npx playwright install-deps`, run as
      # root: Playwright then calls apt-get directly, so an attempt that outlives its limit is
      # stopped, apt included, and the next attempt runs.  sudo resets PATH, and the Playwright CLI
      # needs the node that setup-node installed.
      - name: Install the browser's system packages (${{ matrix.browser_name }})
        timeout-minutes: 16
        run: sudo -H env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive bash .github/scripts/retry.sh 3 290 node_modules/.bin/playwright install-deps "$BROWSER"

      - name: Register the sibling PRADO 4.4 and HTTP/2 checkouts as Composer path repositories
        run: |
          composer config repositories.prado '{"type":"path","url":"../prado","options":{"symlink":true,"versions":{"pradosoft/prado":"4.4.0"}}}'
          composer config repositories.prado-http2 '{"type":"path","url":"../prado-http2","options":{"symlink":true,"versions":{"belisoful/prado-http2":"1.5.0"}}}'

      - name: Install Composer dependencies
        timeout-minutes: 10
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run Playwright browser-client tests (${{ matrix.browser_name }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report (${{ matrix.browser_name }})
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: prado-websocket/build/playwright-report/
          retention-days: 30
